name: Publish changelog entry
description: Commits a release note to the Layerstream changelog, which then rebuilds the public site.

inputs:
  component:
    description: Component key (core, machine or manage). Must match a folder under releases/.
    required: true
  version:
    description: Release version, e.g. v1.4.0.
    required: true
  notes:
    description: Release notes in Markdown. These are published publicly as-is (HTML comments are stripped).
    required: true
  title:
    description: Optional headline for the release.
    required: false
    default: ''
  token:
    description: Token with contents:write on the changelog repository.
    required: true
  repository:
    description: The changelog repository.
    required: false
    default: lkpg-technologies/layerstream-changelog

runs:
  using: composite
  steps:
    - name: Check out changelog repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        token: ${{ inputs.token }}
        path: .layerstream-changelog

    - name: Write entry and push
      shell: bash
      working-directory: .layerstream-changelog
      env:
        COMPONENT: ${{ inputs.component }}
        VERSION: ${{ inputs.version }}
        NOTES: ${{ inputs.notes }}
        TITLE: ${{ inputs.title }}
      run: ${{ github.action_path }}/publish.sh
